<!doctype html>
<html class="no-js" th:lang="${currentLang != null ? currentLang:'en' }" th:with="templateType='product-list'">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="${pageTitle}"></title>
    <meta name="description" th:content="${pageContent} ?: ''"/>
    <meta name="keywords" th:content="${pageKeyword} ?: ''">
    <th:block th:with="pn=${pageData?.pageNum ?: 1},
    base = ${websitePath + (currentLang !=  null && currentLang != 'en' ? currentLang + '/' : '') + pageName},
    slug = ${category != null ? #normalizer.normalizeString(category.name) + '-' + category.id : ''},
    canonical = ${base + (slug != '' ? '/' + slug : '')},
    canonicalUrl = ${pn > 1 ? canonical + '-' + pn : canonical}
    ">
        <link rel="canonical" th:href="${canonicalUrl}" />
        <meta property="og:url" th:content="${canonicalUrl}"/>
        <link th:if="${not #lists.isEmpty(langList) and langList.size() > 1}" rel="alternate" hreflang="x-default"
              th:href="${websitePath + pageName + (slug != '' ? '/' + slug : '') + (pn > 1 ? '-' + pn : '')}"/>
        <th:block th:if="${not #lists.isEmpty(langList) and langList.size() > 1}"
                  th:each="transLang : ${langList}">
            <link rel="alternate" th:hreflang="${transLang.lang}"
                  th:href="${websitePath + (transLang.lang != 'en' ? transLang.lang + '/' : '') + pageName + (slug != '' ? '/' + slug : '') + (pn > 1 ? '-' + pn : '')}"/>
        </th:block>
    </th:block>
    <meta property="og:title" th:content="${pageTitle}"/>
    <meta property="og:description" th:content="${pageContent}"/>

    <meta property="og:type" content="website"/>
    <meta property="og:locale" th:content="${currentLang}"/>
    <meta property="og:site_name" th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>

    <meta name="twitter:title" th:content="${pageTitle}"/>
    <meta name="twitter:description" th:content="${pageContent}"/>
    <meta name="twitter:site" th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:creator" th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>

    <meta name="robots" content="follow, index, max-snippet:-1, max-video-preview:-1, max-image-preview:large"/>
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"/>
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="renderer" content="webkit">
    <th:block th:with="pageHeroes=${topNavPages.?[pageType == 2]}">
        <th:block th:replace="banner :: pageBannerPreload"></th:block>
    </th:block>
    <th:block th:replace="head :: commonHead"></th:block>
    <th:block th:replace="list-infinite-scroll :: assets"></th:block>
    <th:block th:replace="banner :: bannerStyle"></th:block>
    <script type="application/ld+json" th:utext="${faqPageSchemaJson != null ? faqPageSchemaJson : '{}'}">
    </script>
</head>

<body class="body-bg">
<header class="m-hd" style="background-color: var(--theme-header-bg);">
    <!-- 电脑-->
    <th:block th:replace="pc-en :: section(param1='Products')"></th:block>
    <!-- 手机-->
    <th:block th:replace="phone-en :: phone-header"></th:block>

    <!-- 侧边栏内容 -->
    <th:block th:replace="phone-en2 :: r-nav"></th:block>
</header>
<div class="header-height"></div>
<h1 class="sr-only" th:text="${pageDescription}"></h1>
<th:block th:with="pageHeroes=${topNavPages.?[pageType == 2]}">
    <th:block th:replace="banner :: pageBanner"></th:block>
</th:block>
<nav class="m-cat-nav" id="page-list-content">
    <div class="am-container">
        <ol class="am-breadcrumb am-breadcrumb-slash">
            <li><a th:href="${currentPathLang!=''? currentPathLang:'/'} " th:title="${advanced['home.button']}" aria-hidden="false" th:aria-label="${advanced['home.button']}"> <span class="am-padding-right-xs" th:text="${advanced['home.button']}"></span></a></li>
            <li>
                <a th:href="${currentPathLang} + '/' + ${pageName}" th:text="${i18nName}" th:title="${i18nName}" aria-hidden="false" th:aria-label="${i18nName}"></a>
            </li>
            <li th:each="item : ${association}"
                th:if="${category != null and category.parentId != null and item.id == category.parentId}">
                <a th:title="${item.name}" aria-hidden="false" th:aria-label="${item.name}" th:href="
                ${currentPathLang} +
                (${#lists.isEmpty(topNavPages.?[pageType == 2])} ?
                   '/' :
                   ('/' + ${#strings.replace(#strings.trim(topNavPages.?[pageType == 2][0].pageName), ' ', '-')} + '/') ) +
                   ${#normalizer.normalizeString(item.name)} + '-' +
                   ${item.id}"
                   th:text="${item.i18nName}">
                </a>
            </li>
            <li th:if="${category != null}">
                <a th:title="${category.i18nName}" aria-hidden="false" th:aria-label="${category.i18nName}" th:href="
                ${currentPathLang} +
                (${#lists.isEmpty(topNavPages.?[pageType == 2])} ?
                   '/' :
                   ('/' + ${#strings.replace(#strings.trim(topNavPages.?[pageType == 2][0].pageName), ' ', '-')} + '/') ) +
                   ${#normalizer.normalizeString(category.name)} + '-' +
                   ${category.id}"
                   th:text="${category.i18nName}"></a>
            </li>
        </ol>
    </div>
</nav>

<div class="" style="">
    <div class="am-container am-padding phone-clear-padding"
         style="margin: 0px auto 20px !important;padding: 0 5px 0 20px !important;"
         th:if="${!#strings.isEmpty(pageDetailedText) or (category != null and (!#strings.isEmpty(category.pcImgUrl) or !#strings.isEmpty(category.h5ImgUrl)))}"
         th:with="categoryPcImage=${category != null ? category.pcImgUrl : null},
                  categoryH5Image=${category != null ? category.h5ImgUrl : null},
                  categoryDesktopImage=${!#strings.isEmpty(categoryPcImage) ? categoryPcImage : categoryH5Image},
                  categoryMobileImage=${!#strings.isEmpty(categoryH5Image) ? categoryH5Image : categoryPcImage}">
        <div class="product-category-image-region" th:if="${!#strings.isEmpty(categoryDesktopImage)}">
            <picture class="product-category-picture">
                <source media="(max-width: 640px)" th:srcset="${categoryMobileImage}">
                <img th:src="${categoryDesktopImage}"
                     th:alt="${category.i18nName ?: category.name}"
                     width="1920" height="800" loading="lazy" decoding="async">
            </picture>
        </div>
        <div class="product-category-description am-text-lg"
             th:if="${!#strings.isEmpty(pageDetailedText)}" th:text="${pageDetailedText}"></div>
    </div>
    <div class="am-container phone-clear-padding am-margin-top-sm">
        <div class="am-u-md-3 am-u-sm-12" th:if="${category == null}">
            <!-- 数据存在时显示的色块（白色背景） -->
            <div
                    class="am-list admin-sidebar-list"
                    style="background-color: #FFFFFF; border-radius: 8px; min-height: 300px;" th:if="${association != null and #lists.size(association) > 0}">

                <div class="am-padding am-text-lg am-text-bold" >   <h2 class="inline-header" th:text="${advanced['product.category']}"></h2></div>
                <li class="am-panel am-padding-left"
                    th:each="cate, stat : ${association}"
                    th:with="isExpanded=${(category != null and (cate.id == category.id or category.parentId == cate.id))}">

                    <a th:title="${cate.name}" aria-hidden="false" th:aria-label="${cate.name}" class="am-text-bold"
                       th:classappend="${!isExpanded} ? 'am-collapsed'"
                       th:attr="'data-am-collapse' = '{parent: &quot;#collapase-nav-1&quot;, target: &quot;#a_' + ${stat.index} + '&quot;}'">
                        <h3 class="inline-header"><span th:text="${cate.i18nName}"></span></h3>
                        <i class="am-fr am-margin-right"
                           th:if="${cate.children != null and not cate.children.empty}"
                           th:class="${isExpanded} ? 'am-icon-angle-down' : 'am-icon-angle-right'"></i>
                    </a>

                    <ul th:if="${cate.children != null and not cate.children.empty}"
                        class="am-list admin-sidebar-sub am-collapse"
                        th:id="|a_${stat.index}|"
                        th:classappend="${isExpanded} ? 'am-in' : ''" >
                        <li th:each="subCategory : ${cate.children}"
                            th:style="${category != null and category.id == subCategory.id} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''">
                            <a th:title="${subCategory.i18nName}" aria-hidden="false" th:aria-label="${subCategory.i18nName}" th:style="${category != null and category.id == subCategory.id} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''"
                               th:href="
                               ${currentPathLang} +
                               ${#lists.isEmpty(topNavPages.?[pageType == 2]) ?
           '/' :
           '/' +
           #strings.replace(#strings.trim(topNavPages.?[pageType == 2][0].pageName), ' ', '-') +
           '/' +
           #normalizer.normalizeString(subCategory.name) +
           '-' + subCategory.id}">
                                <span th:text="${subCategory.i18nName}"></span>
                            </a>
                        </li>
                    </ul>
            </div>

            <!-- 分类数据为空时显示的占位区块（背景色#afb4b7） -->
            <div th:unless="${association != null and #lists.size(association) > 0}"
                 style="background-color: #afb4b7; border-radius: 8px; min-height: 380px; display: flex; align-items: center; justify-content: center; padding: 20px;">

                <div class="am-text-center am-text-white">
                    <i class="am-icon-2x am-margin-bottom"></i>
                    <h3 class="am-margin-bottom-sm"></h3>
                    <p class="am-text-sm"></p>
                </div>
            </div>
        </div>



        <div class="am-u-sm-12 am-margin-bottom-xl phone-clear-margin"
             th:classappend="${category == null ? 'am-u-md-9' : 'am-u-md-12'}"
             th:if="${not #lists.isEmpty(pageData.rows)}">
            <div style="background:#FFFFFF;" class="product-list-no-pagination">
                <div class="am-container phone-container-all phone-clear-padding am-margin-bottom" >
                    <ul class="product-list-grid am-avg-sm-2 am-avg-md-3 am-avg-lg-4 am-thumbnails am-padding-sm phone-clear-padding phone-clear-margin"
                        style="margin: 0 0;" data-scroll-list th:attr="data-page=${pageData.pageNum},data-next-url=${pageData.totalPages != null and pageData.pageNum < pageData.totalPages ? currentPathLang + '/' + pageName + (category != null ? '/' + #normalizer.normalizeString(category.name) + '-' + category.id : '') + '-' + (pageData.pageNum + 1) : ''}">
                        <li class="dd-hover4 am-margin-top"
                            th:each="index : ${pageData.rows}">
                            <a th:title="${index.pName}" aria-hidden="false" th:aria-label="${index.pName}"
                               th:href="
                           ${currentPathLang} +
                           (${#lists.isEmpty(topNavPages.?[pageType == 2])} ?
           '/' :
           ('/' + ${#strings.replace(#strings.trim(topNavPages.?[pageType == 2][0].pageName), ' ', '-')} + '/') ) +
           'detail/'+
           ${#normalizer.resolveSlugUrl(index.slugUrl, index.pName)} +
           '-'+${index.pid}">
                                <div class="product-card">
                                    <div class="image-box">
                                        <img th:alt="${index.pName}" th:src="${index.url}" alt="" class="image-square">
                                    </div>
                                    <div class="dd-clamp-text-2 am-text-lg">
                                        <span class="p-icon-a-087 am-padding-right-xs"style="color: #FFB400;font-size: 12px;"></span>
                                        <span class="am-text-bold" style="color: #07C160;font-size: 12px"  th:text="${advanced['whole.life.care.manager']}">Whole life care manager</span>
                                    </div>
                                    <span class="product-card-name dd-clamp-text-2 am-padding-top-sm am-text-sm"
                                          th:text="${index.i18nName}"></span>
                                    <p class="product-card-description" th:text="${index.description ?: ''}"></p>
                                </div>
                            </a>

                        </li>
                    </ul>
                </div>
                <th:block th:replace="list-infinite-scroll :: controls(totalPages=${pageData.totalPages}, currentPage=${pageData.pageNum}, listPath=${currentPathLang + '/' + pageName + (category != null ? '/' + #normalizer.normalizeString(category.name) + '-' + category.id : '')})"></th:block>
            </div>
            <div class="am-margin-top am-margin-bottom" th:if="${pageFaqList != null and !#lists.isEmpty(pageFaqList)}">
                <div style="background:#FFFFFF;padding: 0 1.6rem">
                    <th:block th:replace="section-faq :: faqSection(${pageFaqList})"></th:block>
                </div>
            </div>
        </div>


        <div class="am-u-sm-12 am-margin-bottom-xl phone-clear-margin" style="background:#FFFFFF;"
             th:classappend="${category == null ? 'am-u-md-9' : 'am-u-md-12'}"
             th:unless="${not #lists.isEmpty(pageData.rows)}">

            <!-- 产品列表为空时显示的占位背景 -->
            <div
                    style="background-color: #afb4b7; border-radius: 12px; min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">

                <div class="am-text-center am-text-white">
                    <i class="am-margin-bottom"></i>
                    <h3 class="am-margin-bottom-sm"></h3>
                    <p class="am-text-sm"></p>
                </div>
            </div>


        </div>
    </div>
</div>
<!-- 搜索弹窗-->
<th:block th:replace="search :: search"></th:block>

<!-- 弹窗-->
<th:block th:replace="inquiry :: inquiry"></th:block>

<!-- PC端的右侧按钮 -->
<th:block th:replace="right-menu :: right-menu(param1='Products')"></th:block>

<!-- app端显示的下载按钮 -->
<!--    <th:block th:replace="phone-down :: phone-down"></th:block>-->

<!-- 底部导航   -->
<th:block th:replace="footer :: footer"></th:block>

<style>
    /* 主分类链接样式 */
    .am-panel > a {
        display: block;
        padding: 10px 15px;
        color: #333;
        text-decoration: none;
    }

    /* 子分类链接样式 */
    .admin-sidebar-sub li a {
        display: block;
        padding: 8px 15px 8px 25px;
        color: #666;
        text-decoration: none;
    }

    /* 图标浮动样式 */
    .am-icon-angle-right, .am-icon-angle-down {
        float: right;
        margin-right: 16px;
    }

    /* 选中状态样式 */
    .admin-sidebar-sub li:has(a:hover),
    .admin-sidebar-sub li:has(a:focus) {
        background-color: var(--theme-wone);
    }

    .admin-sidebar-sub li:has(a:hover) a,
    .admin-sidebar-sub li:has(a:focus) a {
        color: #fff;
    }
</style>
</body>

</html>
