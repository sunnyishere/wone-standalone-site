<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:fragment="assets" id="site-account-i18n"
          th:attr="data-login-label=${(advanced != null ? advanced['account.login'] : null) ?: 'Login'},
                   data-logout=${(advanced != null ? advanced['account.logout'] : null) ?: 'Logout'},
                   data-close=${(advanced != null ? advanced['close'] : null) ?: 'Close'},
                   data-email=${(advanced != null ? advanced['email'] : null) ?: 'Email'},
                   data-password=${(advanced != null ? advanced['account.password'] : null) ?: 'Password'},
                   data-rejected=${(advanced != null ? advanced['login.account.password.incorrect'] : null) ?: 'Incorrect account or password.'},
                   data-network=${(advanced != null ? advanced['rule.network'] : null) ?: 'Network error, please try again.'}">
</head>
</html>
