<!doctype html>
<html class="no-js" th:lang="${currentLang != null ? currentLang:'en' }">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:if="selectLabel == pageName"  th:text="${pageTitle}"></title>
    <title th:if="selectLabel != pageName"  th:text="${selectLabel} +' | ' +${prodBrand.eName}+ ' Factory Document Library'"></title>
    <meta th:if="selectLabel == pageName" name="description" th:content="${description} ?: ''"/>
    <meta th:if="selectLabel != pageName" name="description" th:content="'Official '+${selectLabel} +' from '+ ${prodBrand.eName} +', Download from our factory technical document library—no agents, full engineering transparency'"/>

    <meta name="keywords" th:content="${pageKeyword} ?: ''">

    <meta property="og:title" th:content="${title}" />
    <meta property="og:description" th:content="${description}"/>
    <th:block th:with="pn=${pageData?.pageNum ?: 1},canonical=${websitePath + (currentLang !=  null && currentLang != 'en' ? currentLang + '/' : '') + pageName +  (selectLabel == pageName?'':'/' + selectLabel)},basePath =${websitePath +pageName +(selectLabel == pageName?'':'/' + selectLabel)}">
        <link rel="canonical" th:href="${pn > 1 ? canonical + '-' + pn : canonical}" />
        <meta property="og:url" th:content="${pn > 1 ? canonical + '-' + pn : canonical}"/>
        <link th:if="${not #lists.isEmpty(langList) and langList.size() > 1}" rel="alternate" hreflang="x-default" th:href="${pn > 1 ? basePath + '-' + pn : basePath}"/>
    </th:block>
    <th:block th:if="${not #lists.isEmpty(langList) and langList.size() > 1}"
              th:each="transLang : ${langList}"
              th:with="pn=${pageData?.pageNum ?: 1}">
        <link rel="alternate" th:hreflang="${transLang.lang}" th:href="${websitePath + (transLang.lang!= 'en'?transLang.lang + '/':'')  + pageName +  (selectLabel == pageName?'':'/' + selectLabel) + (pn > 1 ? '-' + pn : '')}" />
    </th:block>
    <meta property="og:type" content="website" />
    <meta property="og:locale" th:content="${currentLang} ?: 'en'" />
    <meta property="og:site_name"  th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>

    <meta name="twitter:title" th:content="${title}"/>
    <meta name="twitter:description" th:content="${description}"/>
    <meta name="twitter:site" th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:creator" th:content="'@'+${prodBrand.eName ?: 'DefaultBrand'}"/>
    <meta name="robots" content="follow, index, max-snippet:-1, max-video-preview:-1, max-image-preview:large"/>
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"/>
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"/>

    <meta name="format-detection" content="telephone=no">
    <meta name="renderer" content="webkit">
    <link rel="preload"
          th:href="${pageIcon != null and !#strings.isEmpty(pageIcon) ? pageIcon : '/images/case-bg.jpg'}"
          as="image"
          fetchpriority="high">
    <th:block th:replace="head :: commonHead"></th:block>
    <th:block th:replace="head :: faqStyle"></th:block>
    <script type="application/ld+json" th:utext="${faqPageSchemaJson != null ? faqPageSchemaJson : '{}'}">
    </script>
</head>

<body class="body-bg">
<header class="m-hd" style="background-color: var(--theme-header-bg);">

    <th:block th:replace="pc-en :: section(param1='Documents')"></th:block>

    <th:block th:replace="phone-en :: phone-header"></th:block>


    <th:block th:replace="phone-en2 :: r-nav"></th:block>
</header>
<div class="header-height"></div>
<h1 class="sr-only" th:text="${pageDescription}"></h1>
<div class="am-hide-sm-only m-header-banner m-header-1"
     th:style="'background-image: url(' + (${pageIcon} ?: '/images/case-bg.jpg') + ')'
             + '; height: 300px; display: flex; align-items: center; justify-content: center;'
             + 'background-size: cover; background-position: center; ' ">
    <section class="am-container wone-text"
             style="text-align: center;">
        <hgroup data-am-scrollspy="{animation:'slide-bottom', delay: 200}">
            <p class="dd-clamp-text-3 dd-clamp-text-3-left" style="font-size: 30px;font-weight: bold; margin: 0; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.5; position: relative; top: 60px;"
               th:text="${pageDescription}"></p>
        </hgroup>
    </section>
</div>
<div class="am-show-sm-only m-header-banner-other m-header-1-other"
     th:style="'background-image: url(' + (${pageIcon} ?: '/images/case-bg.jpg') + '); ' +

               'height: 150px; width: 100%; position: relative;'">
    <div style="position: absolute; top: 20%; left: 0; width: 100%; padding: 0 15px;
                transform: translateY(-9%); text-align: center;">
        <p class="dd-clamp-text-3"
           style="font-size: 20px; font-weight: bold; color: #FFF;
                  line-height: 1.4; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.7);"
           th:text="${pageDescription}">
        </p>
    </div>
</div>
<nav class="m-cat-nav">
    <div class="am-container">
        <ol class="am-breadcrumb am-breadcrumb-slash am-padding-top-xl">
            <li><a th:href="${currentPathLang!=''? currentPathLang:'/'} " th:title="${advanced['home.button']}" aria-hidden="false" th:aria-label="${advanced['home.button']}"> <span class="p-icon-a-508 am-padding-right-xs" th:text="${advanced['home.button']}"></span></a></li>
            <li>
                <a th:href="${currentPathLang} + '/' + ${pageName}" th:text="${i18nName}" th:title="${i18nName}" aria-hidden="false" th:aria-label="${i18nName}"></a>
            </li>
            <li th:if="${selectValue != null and selectValue != ''}" class="am-active">
                <a th:href="${selectLabel}" th:text="${selectValue}" th:title="${selectLabel}" aria-hidden="false" th:aria-label="${selectLabel}"></a>
            </li>
        </ol>
    </div>
</nav>
<div class="" style="">

    <div class="am-container am-padding phone-clear-padding"
         style="margin: 0px auto 20px !important;padding: 0 10px 0 30px !important;" th:if="${not #strings.isEmpty(pageDetailedText)}">
        <div class="am-text-lg" style="background-color: #FFFFFF;padding: 30px;margin: 0 1px;border-radius: 12px;"
             th:text="${pageDetailedText}">
        </div>
    </div>
    <div class="am-container phone-clear-padding">

        <div class="am-u-md-3 am-u-sm-12 ">
            <ul class="am-list admin-sidebar-list" id="collapase-nav-1" style="background-color: #FFFFFF;">
                <div class="am-padding am-text-lg am-text-bold" ><h2 class="inline-header" th:text="${advanced['filters']}">Filters</h2></div>
                <!-- Document king 面板 -->
                <li class="am-panel am-padding-left">
                    <!-- 面板标题添加展开图标切换 -->
                    <a class="am-text-bold"
                       data-am-collapse="{parent: '#collapase-nav-1', target: '#a1'}">
                        <span th:text="${advanced['document.type']}"></span>
                        <i class="am-fr am-margin-right"
                           th:classappend="${not #lists.isEmpty(association) and #lists.contains(association.![i18nName], selectValue)}
               ? 'am-icon-angle-down' : 'am-icon-angle-right'"></i>
                    </a>
                    <!-- 子列表：根据是否包含选中项添加am-in类 -->
                    <ul class="am-list am-collapse admin-sidebar-sub"
                        id="a1"
                        th:if="${not #lists.isEmpty(association)}"
                        th:classappend="${not #lists.isEmpty(association) and #lists.contains(association.![i18nName], selectValue)}
            ? 'am-in' : ''">
                        <li th:each="index : ${association}"
                            th:style="${selectValue == index.i18nName} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''">
                            <a th:title="${index.i18nName}" aria-hidden="false" th:aria-label="${index.i18nName}" th:style="${selectValue == index.i18nName} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''"
                               th:text="${index.i18nName}"
                               th:href="${currentPathLang} +
                               ${#lists.isEmpty(topNavPages.?[pageType == 4]) ?
                    '/' :
                    '/' +
                    #strings.replace(#strings.trim(topNavPages.?[pageType == 4][0].pageName), ' ', '-') +
                    '/' +
                    #strings.toLowerCase(#strings.replace(#strings.trim(index.name), ' ', '-')) +
                    '-' +
                    index.id}">
                            </a>
                        </li>
                    </ul>
                </li>


                <!-- Sort By 面板 -->
                <li class="am-panel am-padding-left">
                    <a class="am-text-bold" data-am-collapse="{parent: '#collapase-nav-1', target: '#a3'}">
                        <span th:text="${advanced['sort.by.time']}"></span>

                        <i class="am-fr am-margin-right"
                           th:classappend="${#lists.contains({'Oldest first','Newest first'}, selectValue)}
               ? 'am-icon-angle-down' : 'am-icon-angle-right'"></i>
                    </a>
                    <!-- 子列表：根据是否包含选中项添加am-in类 -->
                    <ul class="am-list am-collapse admin-sidebar-sub"
                        id="a3"
                        th:classappend="${#lists.contains({'Oldest first','Newest first'}, selectValue)} ? 'am-in' : ''">
                        <li th:style="${selectValue == 'Oldest first'} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''">
                            <a title="Oldest first" aria-hidden="false" aria-label="Oldest first" th:style="${selectValue == 'Oldest first'} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''"
                               th:text="${advanced['ascending']}"
                               th:href="${currentPathLang} + ${#lists.isEmpty(topNavPages.?[pageType == 4]) ?
                    '/' :
                    '/' +
                    #strings.replace(#strings.trim(topNavPages.?[pageType == 4][0].pageName), ' ', '-') +
                    '/' +
                    #strings.replace(#strings.trim('oldest-first'), ' ', '-') + '-883325'}">
                            </a>
                        </li>
                        <li th:style="${selectValue == 'Newest first'} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''">
                            <a title="Newest first" aria-hidden="false" aria-label="Newest first" th:style="${selectValue == 'Newest first'} ? 'background-color: var(--theme-wone);color: #FFFFFF;' : ''"
                               th:text="${advanced['descending']}"
                               th:href="
                               ${currentPathLang} + ${#lists.isEmpty(topNavPages.?[pageType == 4]) ?
                    '/' :
                    '/' +
                    #strings.replace(#strings.trim(topNavPages.?[pageType == 4][0].pageName), ' ', '-') +
                    '/' +
                    #strings.replace(#strings.trim('newest-first'), ' ', '-') + '-632325'}">
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>

        <div class="am-u-md-9 am-u-sm-12 am-margin-bottom-xl">
            <div class="library-list-panel">
                <div class="library-card-grid" th:if="${not #lists.isEmpty(pageData.rows)}">
                    <article class="library-list-card"
                             th:each="item : ${pageData.rows}"
                             th:data-detail-url="${currentPathLang} + '/' +
                             ${#strings.replace(#strings.trim(pageName), ' ', '-')} + '/detail/' +
                             ${item.slugTitle} + '-' + ${item.id}"
                             th:title="${item.name}"
                             role="link"
                             tabindex="0">
                        <!-- 静态化服务通过该类名收集详情页 URL。 -->
                        <a class="library-detail-link"
                           th:href="${currentPathLang} + '/' +
                           ${#strings.replace(#strings.trim(pageName), ' ', '-')} + '/detail/' +
                           ${item.slugTitle} + '-' + ${item.id}"
                           th:title="${item.name}"
                           tabindex="-1"
                           aria-hidden="true"></a>

                        <div class="library-card-cover">
                            <img th:src="${item.icon != null and item.icon != '' ? item.icon : '/images/case-bg.jpg'}"
                                 th:alt="${item.name}" loading="lazy">
                        </div>

                        <div class="library-card-body">
                            <div class="library-card-topline">
                                <span class="library-card-category" th:text="${item.eName}"></span>
                                <span class="library-card-access is-public"
                                      th:if="${item.isShow == 1}"
                                      th:text="${advanced['public']} ?: 'Public'">Public</span>
                                <span class="library-card-access is-private"
                                      th:if="${item.isShow == 0}"
                                      th:text="${advanced['restricted']} ?: 'Restricted'">Restricted</span>
                            </div>
                            <div class="library-card-brand"
                                 th:title="${prodBrand != null ? prodBrand.eName : ''}"
                                 th:text="${prodBrand != null ? prodBrand.eName : ''}"></div>
                            <h2 class="library-card-title" th:text="${item.name}"></h2>

                            <div class="library-card-facts">
                                <span class="library-card-fact-updated">
                                    <em th:text="${advanced['updated']} ?: 'Updated'">Updated</em>
                                    <strong th:text="${#dates.format(item.updated != null ? item.updated : item.created, 'yyyy.MM')}"></strong>
                                </span>
                                <span class="library-card-fact-language">
                                    <em th:text="${advanced['language']} ?: 'Language'">Language</em>
                                    <strong th:if="${item.locale == 1}">Chinese</strong>
                                    <strong th:if="${item.locale == 2}">English</strong>
                                    <strong th:if="${item.locale == 3}">French</strong>
                                </span>
                                <span class="library-card-fact-file">
                                    <em th:text="${advanced['file']} ?: 'File'">File</em>
                                    <strong th:text="${item.type == 2 ? 'VIDEO' : (item.fName != null and item.fName != '' ? #strings.toUpperCase(item.fName) : 'FILE')}"></strong>
                                </span>
                            </div>

                            <div class="library-card-tags"
                                 th:if="${item.label != null and item.label != ''}">
                                <span class="library-card-tag"
                                      th:each="tag : ${#strings.arraySplit(item.label, '#')}"
                                      th:if="${tag != null and tag != ''}"
                                      th:title="${tag}"
                                      th:text="${tag}"></span>
                            </div>

                            <div class="library-card-action library-list-action">
                                <a class="library-card-button"
                                   th:if="${item.isShow == 1 and item.type == 1}"
                                   th:title="${item.name}"
                                   th:aria-label="${item.name}"
                                   th:href="${item.url}"
                                   download
                                   th:attr="download=${item.fName}"
                                   th:text="${advanced['download']} ?: 'Download'">Download</a>
                                <button type="button" class="library-card-button play-video-btn"
                                        th:if="${item.isShow == 1 and item.type == 2}"
                                        th:attr="data-video-iframe=${#strings.escapeXml(item.url)}"
                                        th:aria-label="${item.name}"
                                        th:text="${advanced['watch.video']} ?: 'Watch Video'">
                                    Watch Video
                                </button>
                                <button type="button"
                                        class="library-card-button"
                                        data-trigger="modal-1"
                                        data-am-modal="{target: '#doc-modal-1', closeViaDimmer: 0}"
                                        th:data-biz-id="'documents-' + ${item.id}"
                                        th:if="${item.isShow == 0}"
                                        th:aria-label="${item.name}"
                                        th:text="${advanced['download']} ?: 'Download'">Download</button>
                            </div>
                        </div>
                    </article>
                </div>
                        <!-- 数据为空时显示占位区块（背景色#afb4b7） -->
                <div th:unless="${not #lists.isEmpty(pageData.rows)}"
                     style="background-color: #afb4b7; border-radius: 12px; min-height: 150px; display: flex; align-items: center; justify-content: center; padding: 20px;">

                    <div class="am-text-center am-text-white">
                        <i class="am-icon-3x am-margin-bottom"></i>
                        <h3 class="am-margin-bottom-sm"></h3>
                        <p class="am-text-sm"></p>
                    </div>
                </div>
                <div class="am-container phone-clear-margin library-pagination">
                    <!-- 分页组件 -->
                    <th:block th:replace="pagination :: pagination(
                    totalPages=${pageData.totalPages},
                    currentPage=${pageData.pageNum},
                    requestUrl=${#strings.replace(#strings.trim(selectLabel), ' ', '-')})"></th:block>
                </div>
            </div>
            <div class="am-margin-top am-margin-bottom" th:if="${pageFaqList != null and !#lists.isEmpty(pageFaqList)}">
                <div style="background:#FFFFFF;padding: 0 1.6rem">
                    <th:block th:replace="section-faq :: faqSection(${pageFaqList})"></th:block>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 视频模态框结构 -->
<div id="videoModal" style="display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background-color: rgba(0,0,0,0.8);
      align-items: center; justify-content: center; z-index: 9999;">
    <div style="position: relative; width: 80%; max-width: 800px; background: #000;
         border-radius: 8px; padding: 10px;">
        <button id="closeVideo" style="position: absolute; top: -30px; right: 0;
                background: transparent; border: none; color: #fff; font-size: 24px;">
            &times;
        </button>
        <div id="videoIframeContainer" style="width: 100%; height: 0; padding-bottom: 56.25%;
             position: relative;">
            <!-- 视频iframe将动态插入这里 -->
        </div>
    </div>
</div>

<!-- 搜索弹窗-->
<th:block th:replace="search :: search"></th:block>

<!-- 弹窗-->
<th:block th:replace="inquiry :: inquiry"></th:block>

<!-- PC端的右侧按钮 -->
<th:block th:replace="right-menu :: right-menu(param1='Documents')"></th:block>

<!-- app端显示的下载按钮 -->
<!--    <th:block th:replace="phone-down :: phone-down"></th:block>-->

<!-- 底部导航   -->
<th:block th:replace="footer :: footer"></th:block>

<style>
    .library-list-panel {
        padding: 20px 10px 5px;
        background: #fff;
    }

    .library-card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
        gap: 0;
        margin-right: -10px;
        margin-left: -10px;
    }

    .library-list-card {
        position: relative;
        display: flex;
        min-width: 0;
        height: auto;
        align-self: start;
        margin: 0 15px 20px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e7eaf0;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 2px 10px rgba(17, 24, 39, .04);
        cursor: pointer;
        transition: transform .2s ease, box-shadow .2s ease;
    }

    .library-list-card:hover,
    .library-list-card:focus {
        outline: 0;
        transform: scale(1.02);
        box-shadow: 0 10px 26px rgba(17, 24, 39, .1);
    }

    .library-detail-link {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    .library-card-cover {
        position: relative;
        height: 168px;
        overflow: hidden;
        background: #e7eee9;
    }

    .library-card-cover img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 16px 16px 0 0;
        filter: saturate(.82) contrast(.96) brightness(.98);
        object-fit: cover;
        transform: scale(1.02);
    }

    .library-card-body {
        display: flex;
        min-width: 0;
        flex: 0 0 auto;
        flex-direction: column;
        padding: 16px 16px 14px;
    }

    .library-card-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .library-card-category {
        display: block;
        max-width: 70%;
        min-width: 0;
        overflow: hidden;
        color: var(--theme-wone);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .library-card-access {
        flex: 0 0 auto;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 12px;
        white-space: nowrap;
    }

    .library-card-access.is-public {
        color: var(--theme-wone);
        background: color-mix(in srgb, var(--theme-wone) 10%, white);
    }

    .library-card-access.is-private {
        color: #f75755;
        background: #fff0ef;
    }

    .library-card-brand {
        min-height: 18px;
        overflow: hidden;
        color: #8a969e;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .library-card-title {
        display: -webkit-box;
        height: 42px;
        min-height: 42px;
        margin: 0 0 5px;
        overflow: hidden;
        color: #0f172a;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
    }

    .library-card-facts {
        display: flex;
        flex-wrap: nowrap;
        gap: 0;
        justify-content: flex-start;
        padding: 8px 0;
        border-top: 1px solid #e7eaf0;
        color: #7c8799;
        font-size: 13px;
    }

    .library-card-facts span {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 4px;
        overflow: hidden;
        box-sizing: border-box;
        white-space: nowrap;
    }

    .library-card-facts .library-card-fact-updated {
        flex: 0 0 auto;
        max-width: none;
        overflow: visible;
    }

    .library-card-fact-language {
        flex: 0 0 auto;
        max-width: 145px;
    }

    .library-card-fact-file {
        flex: 1 1 auto;
        max-width: none;
    }

    .library-card-facts span + span {
        padding-left: 8px;
        margin-left: 8px;
        border-left: 1px solid #e7eaf0;
    }

    .library-card-facts em {
        flex: 0 0 auto;
        overflow: hidden;
        color: #7c8799;
        font-size: 10px;
        font-style: normal;
        font-weight: 700;
        letter-spacing: .06em;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .library-card-facts strong {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        color: #4f5c63;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .library-card-facts .library-card-fact-updated em {
        max-width: 72px;
    }

    .library-card-facts .library-card-fact-updated strong {
        flex: 0 0 auto;
        overflow: visible;
        text-overflow: clip;
    }

    .library-card-tags {
        display: grid;
        min-width: 0;
        grid-template-columns: repeat(3, fit-content(30%));
        justify-content: start;
        gap: 6px;
        margin: 0 0 10px;
    }

    .library-card-tag {
        display: block;
        justify-self: start;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        box-sizing: border-box;
        padding: 4px 8px;
        color: var(--theme-wone);
        border: 1px solid color-mix(in srgb, var(--theme-wone) 18%, #e1e8f2);
        border-radius: 999px;
        background: color-mix(in srgb, var(--theme-wone) 5%, #f5f8fc);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .library-card-action {
        padding-top: 8px;
        margin-top: 0;
        border-top: 1px solid #e7eaf0;
    }

    .library-list-action {
        cursor: pointer;
    }

    .library-card-button {
        display: flex;
        width: 100%;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        color: #0f172a !important;
        border: 0;
        border-radius: 10px;
        background: var(--theme-wone);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: filter .2s ease;
    }

    .library-card-button:hover {
        color: #0f172a !important;
        filter: brightness(.9);
    }

    .library-pagination {
        margin: 0 15px 15px;
        padding-top: 30px;
    }

    @media (max-width: 1100px) {
        .library-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
        .library-list-panel { padding: 12px 15px; }
        .library-card-grid { grid-template-columns: 1fr; margin-right: 0; margin-left: 0; }
        .library-list-card { margin-right: 0; margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .library-list-card { transition: none; }
        .library-list-card:hover { transform: none; }
    }

    /* 视频模态框样式 */
    .video-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
    }

    .video-container {
        position: relative;
        width: 90%;
        max-width: 1200px;
        background-color: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .close-video {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 36px;
        height: 36px;
        background-color: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        z-index: 10;
        transition: background-color 0.3s ease;
    }

    .close-video:hover {
        background-color: rgba(0, 0, 0, 0.8);
    }

    .video-iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: none;
    }

    .play-btn-hover {
        transition: all 0.3s ease;
    }

    .play-btn-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(7, 193, 96, 0.4);
    }

    #videoIframeContainer {
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 56.25%; /* 16:9比例，56.25% = 9/16*100% */
    }

    #videoIframeContainer iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 6px;
    }
</style>

</body>
<script>
    (function () {
        function initVideoModal() {
        const videoModal = document.getElementById('videoModal');
        const closeButton = document.getElementById('closeVideo');
        const iframeContainer = document.getElementById('videoIframeContainer');
        if (!videoModal || !closeButton || !iframeContainer || !document.body) {
            return;
        }

        // 点击卡片进入详情，下载、视频和咨询区域仍执行原有动作。
        document.body.addEventListener('click', function (event) {
            var action = event.target.closest ? event.target.closest('.library-list-action') : null;
            if (action) {
                var downloadLink = action.querySelector('a[download]');
                if (downloadLink && !(event.target.closest && event.target.closest('a[download]'))) {
                    downloadLink.click();
                }
                return;
            }

            if (event.target.closest && event.target.closest('a, button, input, select, textarea')) {
                return;
            }

            var card = event.target.closest ? event.target.closest('.library-list-card') : null;
            var detailUrl = card && card.getAttribute('data-detail-url');
            if (detailUrl) {
                window.location.href = detailUrl;
            }
        });

        document.body.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter' && event.key !== ' ') {
                return;
            }
            if (event.target.closest && event.target.closest('.library-list-action, a, button, input, select, textarea')) {
                return;
            }
            var card = event.target.closest ? event.target.closest('.library-list-card') : null;
            var detailUrl = card && card.getAttribute('data-detail-url');
            if (detailUrl) {
                event.preventDefault();
                window.location.href = detailUrl;
            }
        });

        // 处理所有播放按钮（使用事件委托）
        document.body.addEventListener('click', function (event) {
            if (event.target.closest('.play-video-btn')) {
                const playButton = event.target.closest('.play-video-btn');

                // 获取转义后的iframe代码
                let iframeCode = playButton.getAttribute('data-video-iframe');
                if (!iframeCode) {
                    alert('视频URL为空，请检查数据配置');
                    return;
                }

                // 还原HTML实体
                iframeCode = iframeCode
                    .replace(/&amp;/g, '&')
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"')
                    .replace(/&#39;/g, "'");

                // 创建完整的iframe元素
                iframeContainer.innerHTML = iframeCode;

                // 设置iframe样式
                const iframe = iframeContainer.querySelector('iframe');
                if (iframe) {
                    iframe.style.position = 'absolute';
                    iframe.style.top = '0';
                    iframe.style.left = '0';
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.borderRadius = '6px';
                }

                // 显示模态框
                videoModal.style.display = 'flex';
            }
        });

        // 关闭模态框
        closeButton.addEventListener('click', function () {
            videoModal.style.display = 'none';
            iframeContainer.innerHTML = '';
        });

        // 点击背景关闭
        videoModal.addEventListener('click', function (event) {
            if (event.target === videoModal) {
                videoModal.style.display = 'none';
                iframeContainer.innerHTML = '';
            }
        });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVideoModal);
            return;
        }

        initVideoModal();
    })();
</script>
</html>
