<!doctype html>
<html class="no-js" lang="en-US">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title th:text="${pageTitle}"></title>
    <meta name="description" th:content="${description} ?: ''"/>
    <meta name="keywords" th:content="${pageKeyword} ?: ''">
    <link rel="canonical" th:href="${websitePath}+'/search' " />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="renderer" content="webkit">
    <th:block th:replace="head :: commonHead"></th:block>
    <style>
        .iee-empty-icon{font-size:28px;color:#9AA49F}
        .iee-empty h2{font-size:22px;margin:12px 0 8px}
        .iee-empty p{color:#777;max-width:620px;margin:0 auto}
        .iee-empty-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}
        .iee-btn{border:1px solid #D8D8D8;background:#fff;color:#1D1D1F;border-radius:8px;padding:8px 13px;line-height:1.2;cursor:pointer}
        .iee-btn:hover{border-color:#0DCB67;color:#07934A}
        .iee-btn-primary{background:#0DCB67;border-color:#0DCB67;color:#fff;font-weight:600}
        .iee-btn-primary:hover{background:#0AB75D;color:#fff}
        .tabs-new .category ul li{font-size:16px}
        .tabs-new .category ul li a{display:block;color:inherit;text-decoration:none}
        @media (min-width:641px){
            #searchScopeTabs .category .tab-prev,#searchScopeTabs .category .tab-next{display:none !important}
        }
        #searchScopeTabs .category .tab-prev{display:none;position:absolute;top:0;width:50px;height:50px;border:1px solid #e1e3e6;border-radius:1000px;background:#fff;text-align:center;font-size:0;left:0}
        #searchScopeTabs .category .tab-prev span{display:inline-block;vertical-align:middle;width:9px;height:14px;background-repeat:no-repeat;background-image:url(../images/arrow.svg);background-position:96.77% 25%}
        #searchScopeTabs .category .tab-next span{display:inline-block;vertical-align:middle;width:9px;height:14px;background-repeat:no-repeat;background-image:url(../images/arrow.svg);background-position:61.29% 25%}
        #searchScopeTabs .category .tab-next{position:absolute;top:0;width:50px;height:50px;border:1px solid #e1e3e6;border-radius:1000px;background:#fff;text-align:center;font-size:0;right:0;border-left:1px solid #e1e3e6;z-index:3}
        /* 与首页一致：箭头白底圆形悬浮于 Tab 之上（z-index 高于滑动内容），
           Tab 滑过箭头下方时被白底遮住，无需让位裁剪 */
        .search-card-type{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--theme-wone);line-height:1.2}
        .product-card-description{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:anywhere;font-size:13px;line-height:1.5;height:6em;max-height:6em;color:#666;margin:6px 0 0}
@media (max-width:640px){
.product-card-description{font-size:12px}
}
    </style>
</head>

<body class="body-bg">
<header class="m-hd" style="background-color: var(--theme-header-bg);">
    <th:block th:replace="pc-en :: section(param1='serach')"></th:block>
    <th:block th:replace="phone-en :: phone-header"></th:block>

    <th:block th:replace="phone-en2 :: r-nav"></th:block>
</header>
<div class="header-height"></div>

<nav class="m-cat-nav">
    <div class="am-container">
        <ol class="am-breadcrumb am-breadcrumb-slash am-padding-top-xl">
            <li><a href="/"> <span class="am-padding-right-xs" th:text="${advanced['home.button']}"></span></a></li>
            <li th:text="${searchNav}"></li>
        </ol>
    </div>
</nav>
<div class="" style="">

    <div class="am-container phone-clear-padding am-margin-top-sm">
        <div class="am-u-sm-12 am-u-md-12 am-margin-bottom-xl phone-clear-margin"
             style="background:#FFFFFF;min-height: 660px;">
            <div class="am-container phone-container-all phone-clear-padding am-margin-bottom">
                <div class="tabs-new" id="searchScopeTabs" th:if="${scopeTabs != null and not #lists.isEmpty(scopeTabs)}">
                    <div class="category">
                        <div>
                            <ul>
                                <li th:each="tab : ${scopeTabs}" th:classappend="${tab.active} == 'true' ? 'pc-active'">
                                    <a th:href="${tab.href}" th:title="${tab.label}" aria-hidden="false"
                                       th:aria-label="${tab.label}" th:text="${tab.label}"></a>
                                </li>
                            </ul>
                        </div>
                        <a href="javascript:;" class="tab-prev" aria-label="Previous tabs"><span></span></a>
                        <a href="javascript:;" class="tab-next" aria-label="Next tabs"><span></span></a>
                    </div>
                </div>
                <!-- 产品列表存在时显示 -->
                <div th:if="${pageData != null and pageData.rows != null and not #lists.isEmpty(pageData.rows)}">
                    <ul class="equal-height-card-list am-avg-sm-2 am-avg-md-3 am-avg-lg-4 am-thumbnails am-padding-sm phone-clear-padding phone-clear-margin"
                        style="margin: 0 0;">
                        <li class="equal-height-card-item dd-hover4 am-margin-top" style="padding: 0 10px !important;"
                            th:each="index : ${pageData.rows}">
                            <a class="equal-height-card-link" th:title="${index.name}" aria-hidden="false" th:aria-label="${index.name}"
                               th:href="${currentPathLang} + ${index.detailUrlPrefix} +
                   ${#normalizer.resolveSlugUrl(index.slugUrl, index.enName)} +
                   '-'+${index.id}">
                                <div class="equal-height-card" style="background-color: #F9F9F9; padding: 15px; border-radius: 12px;">
                                    <div class="image-box">
                                        <img th:src="${index.url}" th:alt="${index.name}" class="image-square">
                                    </div>
                                    <div class="search-card-type" th:if="${not #strings.isEmpty(index.typeLabel)}"
                                         th:text="${index.typeLabel}"></div>
                                    <span class="dd-clamp-text-2 am-padding-top-sm am-text-sm"
                                          th:text="${index.name}"></span>
                                    <p class="product-card-description" th:text="${index.description ?: ''}"></p>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- 产品列表为空或 pageData 为 null 时显示空数据图片 -->
                <div th:unless="${pageData != null and pageData.rows != null and not #lists.isEmpty(pageData.rows)}"
                     style="min-height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
                    <div class="iee-empty-icon tn-icon-empty-search" aria-hidden="true">
                        <span class="tn-icon-search"></span>
                    </div>
                    <p style="font-size: 20px;color:#000000;font-weight: bold;" th:text="${noResults}+' &quot;'+${selectValue}+'&quot;'"></p>
                    <p th:text="${keptQuery}"></p>
                    <div class="iee-empty-actions">
                        <button class="iee-btn" type="button" data-trigger="modal-1"
                                data-biz-id="site-search"
                                data-am-modal="{target: '#doc-modal-1', closeViaDimmer: 0, }"
                                th:text="${sourcingRequest}"></button>
                    </div>
                </div>
            </div>

            <div class="am-container phone-clear-margin" style="margin: 0px 15px 15px 15px; padding-top: 30px;">
                <!-- 分页组件 -->
                <th:block th:if="${pageData != null}">
                    <!-- 参数模式分页：requestUrl 形如 /search?keyword=xx&cid=1&（searchQueryBase 为空时无问号段），pageParam='page' -->
                    <th:block th:replace="pagination :: pagination(
            totalPages=${pageData.totalPages},
            currentPage=${pageData.pageNum},
            requestUrl=${currentPathLang} + '/search' + (${searchQueryBase} != '' ? '?' + ${searchQueryBase} + '&amp;' : '?'),
            pageParam='page')">
                    </th:block>
                </th:block>
            </div>


        </div>


    </div>
</div>

<th:block th:replace="search :: search"></th:block>
<th:block th:replace="inquiry :: inquiry"></th:block>
<th:block th:replace="right-menu :: right-menu(param1='serach_'+${selectLabel})"></th:block>
<th:block th:replace="footer :: footer"></th:block>
<th:block th:with="basePath=${cdnEnabled} ? ${cdnPrefix} +'/standalone' : ''">
    <script th:src="@{${basePath + '/js/jquery.min.js?v=' + version}}"></script>
</th:block>

<script th:inline="javascript">
    (function() {
        function init() {
            if (!window.jQuery) {
                return;
            }
            var $ = window.jQuery;
            var $wrap = $('#searchScopeTabs');
            if (!$wrap.length) {
                return;
            }
            var $list = $wrap.find('.category ul').first();
            var $prev = $wrap.find('.category .tab-prev');
            var $next = $wrap.find('.category .tab-next');

            $list.find('li').off('click');

            function maxOffset() {
                return Math.max(0, $list[0].scrollWidth - $list.parent().width());
            }

            $next.on('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var max = maxOffset();
                if (max <= 0) {
                    $next.hide();
                    return;
                }
                $list.stop(true).animate({'margin-left': -max + 'px'}, 500, function() {
                    $prev.show();
                    $next.hide();
                });
            });

            $prev.on('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $list.stop(true).animate({'margin-left': '0px'}, 500, function() {
                    $prev.hide();
                    $next.show();
                });
            });

            $(window).on('resize.sscope', function() {
                if (maxOffset() <= 0) {
                    $list.css('margin-left', '0px');
                    $prev.hide();
                    $next.hide();
                }
            });

            // 初始态：带 scope 进入时选中 Tab 可能在可视区外（移动端），自动滚到可见位置；
            // 箭头状态按滚动后的实际位置设置（无溢出时两个箭头都不展示）
            var $active = $list.find('li.pc-active').first();
            var max = maxOffset();
            var initialOffset = 0;
            if ($active.length && max > 0) {
                // 内容坐标下选中项的左右缘；目标位移需同时满足：左缘不越出左边界、右缘不越出右边界
                var liLeft = $active[0].offsetLeft;
                var liRight = liLeft + $active[0].offsetWidth;
                var holderW = $list.parent().width();
                initialOffset = Math.max(0, Math.min(Math.min(liLeft, liRight - holderW), max));
                if (initialOffset > 0) {
                    $list.css('margin-left', -initialOffset + 'px');
                }
            }
            $prev.toggle(initialOffset > 0);
            $next.toggle(initialOffset < max);
        }

        // main.js 的绑定同样发生在 DOMContentLoaded（$(document).ready），需等它绑完再摘除，
        // 故 ready 后再推迟一个宏任务初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(init, 0);
            });
        } else {
            setTimeout(init, 0);
        }
    })();
</script>
</body>

</html>
