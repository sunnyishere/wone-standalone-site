<div th:fragment="faqSection(faqList)"
     th:with="plainHeading=${templateType != null and #strings.endsWith(templateType, '-list')}"
     th:if="${pageFaqList != null and !#lists.isEmpty(pageFaqList)}"
     style="background:#FFFFFF;margin-bottom: 15px;border-radius: 12px;">

    <div class="am-text-lg am-text-bold" style="padding: 12px 0;">
        <span th:if="${plainHeading}" class="inline-header faq-header" th:text="${advanced['frequently.asked.questions']}">Frequently Asked Questions</span>
        <h2 th:if="${!plainHeading and templateType != 'about' and templateType != 'home'}" class="inline-header faq-header" th:text="${advanced['frequently.asked.questions']}">Frequently Asked Questions</h2>
        <h3 th:if="${templateType == 'about' or templateType == 'home'}" class="inline-header faq-header" th:text="${advanced['frequently.asked.questions']}">Frequently Asked Questions</h3>
    </div>

    <div class="faq-list">
        <div class="faq-item" th:each="item : ${pageFaqList}">
            <div class="faq-question" onclick="this.parentElement.classList.toggle('faq-open')" >
                <span style="flex:1;padding-right:24px;" >
                    <strong th:text="${item.title}"></strong>
                </span>
                <span class="faq-arrow tn-icon-down"></span>
            </div>
            <div class="faq-answer">
                <div class="faq-content" th:utext="${item.content}">
                    Answer
                </div>
            </div>
        </div>
    </div>
</div>
