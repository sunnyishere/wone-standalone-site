<style th:fragment="bannerStyle">
.page-single-banner{width:100%;overflow:hidden;background:#fff}
.banner-split{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);align-items:center;gap:20px;width:100%;max-width:1600px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.banner-split__copy{display:flex;min-width:0;padding-left:clamp(32px,8vw,152px);flex-direction:column;align-items:flex-start;justify-content:center;box-sizing:border-box;transform:translateY(-4px)}
.banner-split__copy h1,.banner-split__copy .banner-split__title,.banner-split__copy h2:not(.banner-split__description){max-width:440px;font-size:clamp(32px,2.3vw,44px);line-height:1.15;font-weight:700;margin:0 0 10px;color:inherit;overflow-wrap:anywhere}
.banner-split__copy p,.banner-split__copy .banner-split__description{max-width:440px;font-size:clamp(18px,1.15vw,22px);line-height:1.45;font-weight:400;margin:0;white-space:pre-line;overflow-wrap:anywhere;color:inherit}
.banner-split__button{display:inline-block;max-width:100%;margin-top:18px;border:1px solid currentColor;border-radius:28px;padding:9px 24px;color:inherit;line-height:1.4;overflow-wrap:anywhere}
.banner-split__button:hover,.banner-split__button:focus{color:var(--theme-wone);text-decoration:none;opacity:.72}
.banner-split__picture{display:block;min-width:0;line-height:0}
.banner-split .banner-split__picture img{display:block;width:100%;height:auto;aspect-ratio:12/5;object-fit:contain;object-position:center}
@media (min-width:641px) and (max-width:1100px){
    .banner-split{grid-template-columns:minmax(270px,38fr) minmax(0,62fr);gap:12px}
    .banner-split__copy{padding-left:clamp(24px,5vw,56px)}
}
@media (max-width:640px){
    .banner-split{display:flex;flex-direction:column;gap:16px;padding:20px 20px 28px;min-height:0}
    .banner-split__picture{order:-1;width:82vw;max-width:310px;margin:0 auto}
    .banner-split .banner-split__picture img{width:100%;height:auto;max-height:none;aspect-ratio:4/3;object-fit:contain}
    .banner-split__copy{width:100%;padding-left:0;transform:none}
    .banner-split__copy h1,.banner-split__copy .banner-split__title,.banner-split__copy h2:not(.banner-split__description){font-size:28px}
    .banner-split__copy p,.banner-split__copy .banner-split__description{font-size:16px}
}
.hero-embla .hero-embla__slide--split{height:auto;min-height:0;background:#fff;overflow:visible}
.hero-embla .hero-embla__container{align-items:stretch}
</style>

<th:block th:fragment="pageBannerPreload"
          th:with="pageHero=${#lists.isEmpty(pageHeroes) ? null : pageHeroes[0]},
                   desktopImage=${pageHero != null and !#strings.isEmpty(pageHero.icon) ? pageHero.icon : (pageHero != null ? pageHero.h5ImgUrl : null)},
                   mobileImage=${pageHero != null and !#strings.isEmpty(pageHero.h5ImgUrl) ? pageHero.h5ImgUrl : (pageHero != null ? pageHero.icon : null)}">
    <link th:if="${!#strings.isEmpty(desktopImage)}" rel="preload" as="image" fetchpriority="high"
          media="(min-width: 641px)" th:href="${desktopImage}">
    <link th:if="${!#strings.isEmpty(mobileImage)}" rel="preload" as="image" fetchpriority="high"
          media="(max-width: 640px)" th:href="${mobileImage}">
</th:block>

<th:block th:fragment="pageBanner"
     th:with="pageHero=${#lists.isEmpty(pageHeroes) ? null : pageHeroes[0]},
              desktopImage=${pageHero != null and !#strings.isEmpty(pageHero.icon) ? pageHero.icon : (pageHero != null ? pageHero.h5ImgUrl : null)},
              mobileImage=${pageHero != null and !#strings.isEmpty(pageHero.h5ImgUrl) ? pageHero.h5ImgUrl : (pageHero != null ? pageHero.icon : null)}">
<div class="page-single-banner" th:if="${!#strings.isEmpty(desktopImage)}">
    <div class="banner-split">
        <div class="banner-split__copy" style="color: #060606;">
            <h1 th:text="${!#strings.isEmpty(pageHeroTitle) ? pageHeroTitle : i18nName}"></h1>
            <h2 class="banner-split__description" th:text="${pageHeroDescription != null ? pageHeroDescription : ''}"></h2>
            <a th:if="${pageButtonVisible == true}"
               class="banner-split__button" th:href="${pageButtonLink}"
               th:text="${pageButtonTitle}"></a>
        </div>
        <picture class="banner-split__picture">
            <source media="(max-width: 640px)" width="800" height="800"
                    th:srcset="${mobileImage}">
            <img th:src="${desktopImage}"
                 th:alt="${!#strings.isEmpty(pageHeroTitle) ? pageHeroTitle : i18nName}"
                 width="1920" height="800" fetchpriority="high" loading="eager">
        </picture>
    </div>
</div>
</th:block>
